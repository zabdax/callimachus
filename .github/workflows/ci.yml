name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege — jobs don't need the default GITHUB_TOKEN scopes.
permissions: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/workers/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Workers test
        working-directory: apps/workers
        run: |
          npm ci
          npm test
      - run: npm run build
      - name: Workers build
        working-directory: apps/workers
        run: |
          npm ci
          npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    defaults:
      run:
        working-directory: apps/web
    env:
      VITE_ENABLE_TEST_ROUTES: 'true'
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  lighthouse:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: apps/web
    env:
      LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Serve dist + run Lighthouse CI
        run: |
          npm install -g @lhci/cli http-server
          http-server dist -p 8080 --silent &
          SERVER_PID=$!
          sleep 3
          lhci collect \
            --url=http://localhost:8080/index.html \
            --numberOfRuns=1 \
            --outputDir=.lighthouseci
          lhci upload \
            --target=filesystem \
            --outputDir=.lighthouseci
          kill $SERVER_PID || true

  deploy:
    runs-on: ubuntu-latest
    needs: [build-test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/workers/package-lock.json
            scripts/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm ci
        working-directory: apps/workers
      - run: npm ci
        working-directory: scripts
      - name: Deploy Workers + Pages + Supabase migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_ENABLE_TEST_ROUTES: 'false'
        run: node scripts/deploy.mjs