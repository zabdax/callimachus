name: rotate-firebase-access-token

# Mint a fresh GCP access token from the service-account JSON and push it
# to the Cloudflare Worker as the FIREBASE_ACCESS_TOKEN secret.
#
# GCP access tokens expire after 60 minutes; we rotate every 50 minutes so
# the Worker always has a token with at least 10 minutes of validity left.
#
# Required GitHub secrets (set in Settings → Secrets and variables → Actions):
#   GCP_SA_JSON_BASE64     base64-encoded contents of hsc-tracker-sa.json
#   CLOUDFLARE_API_TOKEN   Cloudflare API token with Workers Scripts:Edit scope
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account id
#
# Manual trigger: run from the Actions tab → "Rotate Firebase access token".

on:
  schedule:
    # Every 50 minutes. Cron is UTC; this hits :00 and :50 of every hour.
    - cron: '0,50 * * * *'
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decode service-account JSON
        env:
          GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 }}
        run: |
          mkdir -p ~/.config/hsc-tracker
          echo "$GCP_SA_JSON_BASE64" | base64 -d > ~/.config/hsc-tracker/sa.json
          ls -la ~/.config/hsc-tracker/sa.json

      - name: Install scripts dependencies
        # mint-firebase-token.mjs only uses node:fs + node:crypto, but we
        # install the rest anyway in case the script grows new deps.
        working-directory: scripts
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Mint new access token
        working-directory: scripts
        # mint-firebase-token.mjs reads the SA JSON from argv[2] or the
        # default path; the step before this wrote it to ~/.config/hsc-tracker/sa.json
        # (Linux home on the GitHub runner, not the Windows default in the script).
        run: |
          TOKEN=$(node src/mint-firebase-token.mjs ~/.config/hsc-tracker/sa.json | grep '^TOKEN:' | sed 's/^TOKEN://')
          if [ -z "$TOKEN" ]; then
            echo "ERROR: failed to mint token"
            exit 1
          fi
          echo "TOKEN_LEN=${#TOKEN}"
          echo "TOKEN=${TOKEN}" >> "$GITHUB_ENV"
          echo "expires_at=$(date -u -d '+55 minutes' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Push token to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN: ${{ env.TOKEN }}
        working-directory: apps/workers
        run: |
          # wrangler reads CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID from env.
          # Pipe the token into `wrangler secret put` non-interactively.
          echo "$TOKEN" | npx wrangler secret put FIREBASE_ACCESS_TOKEN

      - name: Verify secret was updated
        working-directory: apps/workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler secret list

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
          EXPIRES_AT: ${{ env.expires_at }}
        run: |
          {
            echo "### 🔄 FIREBASE_ACCESS_TOKEN rotation"
            echo ""
            echo "- **Status**: ${JOB_STATUS}"
            echo "- **Expires at**: ${EXPIRES_AT} UTC"
            echo "- **Trigger**: ${EVENT_NAME}"
            if [ "${EVENT_NAME}" = "schedule" ]; then
              echo "- **Schedule**: every 50 minutes"
            fi
            echo ""
            if [ "${JOB_STATUS}" = "success" ]; then
              echo "Worker secret updated. Next rotation: ~50 minutes."
            else
              echo "❌ Rotation failed — Worker will start returning 503 within 60 minutes of last successful rotation. Investigate logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"