name: rotate-firebase-access-token

# Mint a fresh GCP access token from the service-account JSON and push it
# to the Cloudflare Worker as the FIREBASE_ACCESS_TOKEN secret.
#
# GCP access tokens expire after 60 minutes; we rotate every 50 minutes so
# the Worker always has a token with at least 10 minutes of validity left.
#
# Required GitHub secrets (set in Settings → Secrets and variables → Actions):
#   GCP_SA_JSON_BASE64     base64-encoded contents of hsc-tracker-sa.json
#   CLOUDFLARE_API_TOKEN   Cloudflare API token with Workers Scripts:Edit scope
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account id
#
# Manual trigger: run from the Actions tab → "Rotate Firebase access token".

on:
  schedule:
    # Every 50 minutes. Cron is UTC; this hits :00 and :50 of every hour.
    - cron: '0,50 * * * *'
  workflow_dispatch:

# Least privilege — checkout needs read access to the repo.
permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preflight — check required secrets are set
        env:
          GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$GCP_SA_JSON_BASE64" ] && missing="$missing GCP_SA_JSON_BASE64"
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing. Set them in Settings → Secrets and variables → Actions."
            echo "### ❌ FIREBASE_ACCESS_TOKEN rotation — missing secrets$missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Decode service-account JSON
        env:
          GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 }}
        run: |
          mkdir -p ~/.config/hsc-tracker
          if ! echo "$GCP_SA_JSON_BASE64" | base64 -d > ~/.config/hsc-tracker/sa.json 2>/tmp/b64err.txt; then
            echo "::error::GCP_SA_JSON_BASE64 is not valid base64. Re-encode the service-account JSON with: base64 -w0 hsc-tracker-sa.json"
            cat /tmp/b64err.txt
            exit 1
          fi
          if ! node -e "JSON.parse(require('fs').readFileSync(process.env.HOME+'/.config/hsc-tracker/sa.json','utf8'))"; then
            echo "::error::Decoded secret is not valid JSON — GCP_SA_JSON_BASE64 must be base64 of the service-account JSON file."
            exit 1
          fi
          ls -la ~/.config/hsc-tracker/sa.json

      - name: Install scripts dependencies
        # mint-firebase-token.mjs only uses node:fs + node:crypto, but we
        # install the rest anyway in case the script grows new deps.
        working-directory: scripts
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Mint new access token
        working-directory: scripts
        # mint-firebase-token.mjs reads the SA JSON from argv[2] or the
        # default path; the step before this wrote it to ~/.config/hsc-tracker/sa.json
        # (Linux home on the GitHub runner, not the Windows default in the script).
        #
        # The token is written to a temp file instead of $GITHUB_ENV — env
        # values are not auto-masked, so any later `echo` could leak it into
        # logs. The add-mask line is defense in depth for this job's output.
        run: |
          TOKEN=$(node src/mint-firebase-token.mjs ~/.config/hsc-tracker/sa.json | grep '^TOKEN:' | sed 's/^TOKEN://')
          if [ -z "$TOKEN" ]; then
            echo "::error::Failed to mint token. Check the mint step logs above — usually wrong SA key, revoked key, or missing datastore/cloud-platform scope."
            exit 1
          fi
          case "$TOKEN" in
            ya29.*) echo "Token format looks correct (ya29...)." ;;
            *) echo "::error::Minted value does not start with ya29. — refusing to push a wrong credential type to the Worker."; exit 1 ;;
          esac
          echo "::add-mask::${TOKEN}"
          echo "TOKEN_LEN=${#TOKEN}"
          umask 077
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/fb_token.txt"
          echo "expires_at=$(date -u -d '+55 minutes' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Push token to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/workers
        run: |
          npm ci --no-audit --no-fund
          # wrangler reads CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID from env.
          # Pipe the token into `wrangler secret put` non-interactively; wrangler
          # is pinned to the version in apps/workers devDependencies via npm ci.
          # npx is required: node_modules/.bin is not on PATH in Actions.
          npx wrangler secret put FIREBASE_ACCESS_TOKEN < "$RUNNER_TEMP/fb_token.txt"
          rm -f "$RUNNER_TEMP/fb_token.txt"

      - name: Verify secret was updated
        working-directory: apps/workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler secret list

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
          EXPIRES_AT: ${{ env.expires_at }}
        run: |
          {
            echo "### 🔄 FIREBASE_ACCESS_TOKEN rotation"
            echo ""
            echo "- **Status**: ${JOB_STATUS}"
            echo "- **Expires at**: ${EXPIRES_AT} UTC"
            echo "- **Trigger**: ${EVENT_NAME}"
            if [ "${EVENT_NAME}" = "schedule" ]; then
              echo "- **Schedule**: every 50 minutes"
            fi
            echo ""
            if [ "${JOB_STATUS}" = "success" ]; then
              echo "Worker secret updated. Next rotation: ~50 minutes."
            else
              echo "❌ Rotation failed — Worker will start returning 503 within 60 minutes of last successful rotation. Investigate logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"