# wrangler.toml for HSC Crackers Workers (Plan 4, no-screenshot revision).
#
# Per the no-screenshot decision, R2 is intentionally NOT bound. The
# bKash approval flow goes through TrxID-only: the user submits a
# TrxID via the form, the admin reviews it via WhatsApp (or email),
# and approves in /admin/approvals. See HANDOFF.md §R2 skipped.
#
# The KV namespace is REQUIRED (presence nonces + leaderboard cache).
# Set the IDs below after running:
#   wrangler kv:namespace create TRACKER_CACHE
#
# 5 cron triggers is the free-tier maximum — we use 4 by bundling
# emitNonce + sendRevisionReminder into one (both hourly at :30).

name = "hsc-crackers-workers"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# === Vars (non-secret env) ===
[vars]
ENVIRONMENT = "production"
# Firebase project id — also set as a secret if you want server-side
# reads to use the secret (some workflows prefer that).
FIREBASE_PROJECT_ID = "REPLACE_WITH_FIREBASE_PROJECT_ID"
# Public Workers origin — the web app calls `${WORKERS_BASE}/api/<name>`.
WORKERS_BASE = "https://hsc-crackers-workers.zubayer-hasanshaad.workers.dev"

# === KV namespace for ephemeral state (presence nonces, leaderboard cache) ===
[[kv_namespaces]]
binding = "TRACKER_CACHE"
id = "REPLACE_WITH_KV_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_ID"

# === Cron triggers (max 5 on free tier; we use 4) ===
[triggers]
crons = [
  "0 23 * * *",  # DAILY_PLAN: generate daily plans for all uids
  "0 * * * *",   # LEADERBOARD_ROLLUP: hourly roll-up
  "0 0 * * *",   # BATCH_STATUS: daily batch status recompute
  "30 * * * *",  # NONCE_AND_REMINDER: emit nonces + send revision reminders
]

# === Secrets (NOT committed) — set with `wrangler secret put NAME` ===
#   FIREBASE_ACCESS_TOKEN  — pre-minted service-account access token
#                            (rotated by external cron every ~60 min)
#
# Public Firebase config (NOT secret) is read by the client from
# apps/web/.env.production — VITE_FIREBASE_* values.

# === Routes ===
# Optional: bind to a custom domain (e.g. api.hsc-cracker.com).
# routes = [{ pattern = "api.hsc-cracker.com/*", custom_domain = true }]
